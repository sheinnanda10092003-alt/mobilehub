services:
  - type: web
    name: mobilehub
    env: php
    buildCommand: "./build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: MobileHub
      - key: APP_URL
        fromService:
          type: web
          name: mobilehub
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mobilehub-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mobilehub-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mobilehub-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mobilehub-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mobilehub-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: mobilehub-postgres
    plan: free
    databaseName: mobilehub
    user: mobilehub
